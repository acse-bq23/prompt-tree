<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{Prompt Tree · Probe 报告}}</title>
<style>
:root{--ink:#263c30;--muted:#657465;--green:#39633b;--line:#dbe3d7;--paper:#fff;--mint:#eef4e9;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#f6f8f3;color:var(--ink);font:14px/1.55 system-ui,sans-serif}header{border-bottom:1px solid var(--line);background:#fcfdfb}header>div,main{width:min(1480px,100%);margin:auto;padding:0 clamp(14px,3vw,48px)}header>div,.heading,.panelhead,.row,.transport{display:flex;align-items:center;justify-content:space-between;gap:12px}header>div{height:54px}header strong{font:600 17px Georgia,serif}.muted,small,.caption{color:var(--muted)}.heading{padding:22px 0}.heading h1{margin:0;font:500 clamp(26px,2.8vw,40px)/1.2 Georgia,system-ui,serif}.heading p{margin:6px 0 0;font-size:13px}.stats{display:flex;flex-wrap:wrap;gap:18px;border-left:2px solid #93ac86;padding:2px 0 2px 16px}.stat{display:grid}.stat b{font:500 24px/1.15 Georgia,serif}.stat span{font-size:11px;color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,30%);gap:16px;align-items:start}.panel{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 14px #25402608;overflow:hidden}.panelhead,.transport,.detail,.more{padding:16px 19px}h2,h3,p{margin:0}h2{font-size:18px}h3{font-size:14px;margin:16px 0 6px}.panelhead{border-bottom:1px solid var(--line)}.panelhead small{font:12px var(--mono)}.stage{overflow:auto;background-color:#fafbf7;background-image:radial-gradient(#cad5c4 .7px,transparent .7px),radial-gradient(ellipse at 34% 62%,#eaf2e58c,transparent 70%);background-size:18px 18px,100% 100%}#tree{display:block;width:100%;user-select:none}.level-line{stroke:#dfe6d9;stroke-dasharray:3 7}.level-name{font:10px var(--mono);fill:#778873;letter-spacing:1px}.edge,.particle{fill:none;stroke-linecap:round}.edge{stroke:#c1d1ba;stroke-width:2}.edge.active{stroke:#6f975e;stroke-width:2.7}.particle{stroke:#bad6a3;stroke-width:4;stroke-dasharray:.045 .955;stroke-dashoffset:1;opacity:0;pointer-events:none}.playing .particle.active{opacity:1;animation:flow 1.8s linear infinite}@keyframes flow{to{stroke-dashoffset:0}}
.node{cursor:pointer;outline:none}.card{fill:white;stroke:#cfdbca;filter:drop-shadow(0px 3px 3px #35472c0e)}.node.winner .card{fill:#edf5e5;stroke:#a6bf96}.node.incomplete .card{stroke:#ad7866;stroke-dasharray:5 3}.halo{fill:none;stroke:#a8c396;opacity:0}.node.selected .halo,.node:focus-visible .halo{opacity:.85}.node.selected .card,.node:hover .card{stroke:#6a9257;stroke-width:1.7}.port{fill:white;stroke:#9db490}.divider{stroke:#e2e8dd}.meta,.status,.delta{font:10px var(--mono);fill:#5f7759}.node-title{font:500 13px system-ui;fill:var(--ink)}.score{font:24px Georgia,serif;fill:#345337}.delta.negative{fill:#a46150}
button,select{cursor:pointer;font:inherit;color:var(--ink);border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:6px 11px}button:hover,button[aria-pressed=true]{background:var(--mint)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #6b935a;outline-offset:3px}.transport{border-top:1px solid var(--line);gap:10px}.transport button,.transport select,.panelhead button{font-size:12px}.transport #play{background:#36583c;color:white;min-width:68px;border-color:transparent}.transport input{min-width:34px;flex:1;accent-color:#567a48}.transport output{font:11px var(--mono);white-space:nowrap}.detail{max-height:680px;overflow:auto;overflow-wrap:anywhere}.detail h2{margin:5px 0 8px}.detail nav{display:flex;gap:4px;margin:12px 0;background:#f2f5ef;border-radius:7px;padding:3px}.detail nav button{border:0;background:transparent;flex:1;padding:5px 3px;font-size:12px}.detail nav button[aria-pressed=true]{background:white;box-shadow:0 1px 4px #324b2c19}.detail pre,.more pre,.diff{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.65 var(--mono);padding:10px;background:#f4f6f0;border-radius:6px;margin:5px 0 11px}.detail b{font-size:12px}.diff .add{background:#e0efda}.diff .remove{background:#f6e5df}.item{border-top:1px solid var(--line);padding-top:8px}.more{margin:16px 0 24px}.more summary,details summary{cursor:pointer}.more p{margin:10px 0}.more pre{max-height:360px;overflow:auto}.notice{font-size:12px;color:var(--muted);margin-top:10px}
@media(min-width:1600px){.detail{max-height:760px}}@media(max-width:900px){.grid{grid-template-columns:1fr}.heading{align-items:flex-start;flex-direction:column}.detail{max-height:unset}.stats{margin-top:4px}.transport{flex-wrap:wrap}}@media(max-width:540px){.stats{gap:12px}.stat b{font-size:19px}.transport,.panelhead,.detail,.more{padding:12px}.transport input{order:4;flex-basis:100%}.panelhead h2{font-size:16px}}@media(prefers-reduced-motion:reduce){.particle{display:none}}

.compare{margin-top:16px;scroll-margin:16px}.compare select{max-width:100%;font-size:13px}.compareBody{padding:14px 18px;min-width:0}.compare .caption{font-size:12px}.compareBody p{margin-bottom:7px}.compareBody details{margin:0}.changeStats{font-size:13px;color:#47604b}.filediff{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:12px 0}.filediff .range,.fold summary{padding:6px 12px;background:#eef3f5;font:12px/1.5 var(--mono);color:#486776}.fold summary{background:#f4f6f3;color:var(--muted);cursor:pointer}.evidence-summary{background:#f3f6ef;padding:10px 12px;margin:6px 0 8px;border-left:3px solid #a1b996}.evidence-summary p+p{margin-top:6px}#jumpDiff{display:inline-block;color:var(--green);margin-top:12px}.compare .panelhead label{font-size:12px}.compareBody>details{font-size:12px;color:var(--muted)}@media(max-width:600px){.compare .panelhead{flex-wrap:wrap}.compareBody{padding:10px}}

.compare .panelhead{align-items:flex-end;padding:20px 24px;background:#fafbf8}.compare .panelhead h2{font-size:22px;letter-spacing:-.035em}
.compareBody{padding:16px 24px 24px}.versionPickers label{font-weight:600;color:#59675b}.versionPickers select{background:#fff;font-weight:400}
.effects h3,.diffTitle{margin:0 0 10px;font-size:15px;letter-spacing:.02em}.diffTitle{border-top:1px solid var(--line);margin:22px 0 10px;padding-top:18px}
.scores,.casegroups,.outputs,.filehead,.codepair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.scores{border:1px solid #cbd8c8;border-radius:9px;overflow:hidden}.scorebox{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:14px 19px;background:#f5f6f1}
.scorebox+.scorebox{background:#eaf2e4;border-left:1px solid #cbd8c8}.scorebox small{width:100%;font:600 12px var(--mono);color:#4e6555}
.scorebox strong{font:500 clamp(25px,3vw,40px)/1 Georgia,serif;font-variant-numeric:tabular-nums;color:#2b4633}.scorebox span{color:#5b6f60;font:12px var(--mono)}
.effectDelta{margin:8px 0;color:#344e39;font-weight:600}.sampleTotals{font-size:12px;color:var(--muted);margin:12px 0 6px}
.casegroups{gap:10px;align-items:start}.casegroup{border:1px solid #d4e0d1;border-radius:7px;overflow:hidden}.casegroup>summary{padding:9px 12px;background:#eef5ea;color:#355f3e}
.casegroup.regressed{border-color:#e6d8d2}.casegroup.regressed>summary{background:#f8f0ec;color:#8b503e}
.casegroup>summary b{float:right;font:600 13px/1.65 var(--mono)}.caseitem,.emptyCases{padding:7px 12px;font-size:13px}.caseitem+.caseitem{border-top:1px solid var(--line)}
.caseitem summary{font:12px/1.65 var(--mono)}.outputs{gap:8px;margin-top:8px}.caseitem small{font-size:11px;color:var(--muted)}.caseitem pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 var(--mono);padding:6px 8px;margin:2px 0 6px;background:#f5f6f3;border-radius:4px}
.filehead{background:#30493b;color:#f2f6ee}.filehead>div{padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}.filehead b,.filehead small{font:12px var(--mono);overflow-wrap:anywhere}.filehead small{color:#d0dfce}

.codecell+.codecell,.filehead>div+div{border-left:1px solid #c7d5c6}.codecell code,.codecell summary{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere}
.codecell .lineno,.codecell .mark{color:#6f8074;text-align:right;user-select:none}.codecell.add{background:#e6f3e4}.codecell.remove{background:#f8e7e2}.codecell.empty{background:repeating-linear-gradient(135deg,#f7f8f5,#f7f8f5 4px,#eff1ec 4px,#eff1ec 5px)}
@media(max-width:750px){.casegroups{grid-template-columns:1fr}.compare .panelhead{flex-wrap:wrap}.compareBody,.compare .panelhead{padding:12px}.codecell{padding:3px;gap:2px;font-size:11px}.filehead>div,.scorebox{padding:9px}.scorebox{gap:6px}}

/* Report navigation and reading surface */
header{background:#213f32;border-color:#20392f;color:#f6f8ed}
header strong{display:flex;align-items:center;gap:9px;font-size:20px}
header .logomark{background:#f6f8ed;border-radius:6px}
header nav{display:flex;gap:6px}header nav a{color:#ecf2e8;text-decoration:none;font-size:13px;padding:5px 10px;border-radius:5px}
header nav a:hover,header nav a:focus-visible{background:#365642}.heading{padding:27px 0}.heading #kind{display:block;margin-bottom:5px;color:#516d58;font-size:12px;font-weight:600}
.stats{padding:10px 16px;gap:22px;background:#edf2e8;border-radius:0 8px 8px 0}.panel{box-shadow:0 6px 22px #29402709}summary:focus-visible,.stream:focus-visible{outline:2px solid #567c5e;outline-offset:-2px}
.casegroups:has(.casegroup[open]){grid-template-columns:1fr}

.stream{max-height:clamp(260px,48vh,480px);overflow:auto;scrollbar-gutter:stable;list-style:none;display:flex;flex-direction:column;gap:10px;margin:0;padding:16px clamp(10px,2vw,26px)}
.turn{max-width:min(80%,78ch);align-self:flex-start}.turn small{display:block;margin:0 3px 3px;font:600 11px/1.4 system-ui,sans-serif;color:#5c6f61}

.turn.customer{align-self:flex-end}.turn.customer small{text-align:right}.turn.customer p{background:#e5efdc;border-color:#d2e1c8;border-radius:12px 3px 12px 12px}
.turn.event{align-self:center;max-width:92%;text-align:center}.turn.event small{font:11px var(--mono);color:#5a6772}.turn.event p{background:#edf0ef;border:0;border-radius:5px;padding:3px 9px;font-size:12px;color:#485a56}
.outputs{gap:12px;margin:12px 0 8px}.answerCard,.goldAnswer{min-width:0;border:1px solid #dce4d8;border-radius:8px;padding:9px 12px}.answerCard>small,.goldAnswer>small{font-weight:650;font-size:12px}
.answerCard.correct{border-top:3px solid #79a276}.answerCard.incorrect{border-top:3px solid #bc8575}.answerCard.correct>small{color:#3e7144}.answerCard.incorrect>small{color:#8a4e40}
.goldAnswer{margin-bottom:14px;background:#f5f4ed;border-color:#e4e1d3}.goldAnswer>small{color:#72663d}
.caseitem .answerCard pre,.caseitem .goldAnswer pre{background:transparent;padding:4px 0 0;margin:0}
@media(max-width:600px){.heading{padding:18px 0}.stats{gap:12px}.caseitem{padding:0 8px}.outputs{gap:6px}.answerCard,.goldAnswer{padding:7px}.casePreview{display:block;margin:3px 0 0 16px;max-width:calc(100% - 16px)}.turn{max-width:91%}header nav{gap:0}header nav a{padding:5px 7px}}
.heading{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,26rem),1fr));gap:1.5rem;align-items:center}
.heading h1{font-size:clamp(1.85rem,1.35rem + 2vw,3rem);overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,6rem),1fr));gap:.9rem;padding:1rem;border:1px solid #cfdac9;border-radius:.75rem;background:var(--paper)}
.stat b{font-variant-numeric:tabular-nums}.stat span{margin-block-start:.3rem}
#growth,.compare{container-type:inline-size}.layerNav{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,7.1rem),1fr));gap:1px;background:var(--line);border-block-end:1px solid var(--line)}
.layerNav button{border:0;border-radius:0;display:grid;gap:.15rem;text-align:start;padding:.65rem .8rem;background:#f8faf5}
.layerNav button:hover,.layerNav button[aria-pressed=true]{background:#e5eedf;box-shadow:inset 0 -3px #60815c}.layerNav small{font-size:.73rem}.layerNav b{font:500 1.25rem Georgia,serif;color:#324e39}
.layerNav button:focus-visible{outline-offset:-3px}.stream{max-block-size:clamp(16rem,48dvh,30rem);overscroll-behavior:contain}
@container (max-width:44rem){.versionPickers{inline-size:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.versionPickers select{inline-size:100%}.panelhead{flex-wrap:wrap}.layerNav{grid-template-columns:repeat(auto-fit,minmax(min(100%,5rem),1fr))}}
.lockSummary{padding:12px 19px;background:#eff5ec;border-bottom:1px solid var(--line)}.lockSummary strong{display:block;color:#304f37}.lockSummary p{margin:.2rem 0 0;font-size:13px}.screen-score{font:11px system-ui;fill:#546851}
.testSummary{background:#edf4f7}.testSummary strong{color:#275c70}.metric-label{font:12px system-ui;fill:#425448}.metric-value{font:600 15px var(--mono);fill:#284832}.test-metric{fill:#245d75}.test-band{fill:#e9f3f7}

.evalSummary{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,8rem),1fr));gap:7px;margin:10px 0}
.evalCard{padding:10px 11px;border-radius:8px;background:#f0f5ed;color:#36543b;min-width:0}
.evalCard.test{background:#eaf2f6;color:#24566b}.evalCard span,.evalCard small{display:block;color:inherit;font-size:11px}
.evalCard strong{font:500 26px/1.4 Georgia,serif;font-variant-numeric:tabular-nums}.evalCard small{font-variant-numeric:tabular-nums}
.roundTable{width:100%;border-collapse:collapse;color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}
.roundTable caption{text-align:left;font-size:13px;font-weight:650;padding:8px 0}
.roundTable th,.roundTable td{padding:6px 3px;border-bottom:1px solid var(--line);vertical-align:middle}
.roundTable th{font-size:12px;font-weight:500}.roundTable th:first-child{text-align:left}
.roundTable td{font-weight:600}.roundTable td small{display:block;font:11px/1.4 var(--mono)}
.evalRecords{margin-top:14px}.evalRecords summary{color:var(--muted)}
.node .expandHint{font:14px system-ui;fill:#476b54}.node:hover .expandHint,.node:focus-visible .expandHint{fill:#153c24}
#nodePeek{position:fixed;inset:auto;margin:0;width:min(340px,calc(100vw - 20px));max-height:min(75dvh,550px);overflow:auto;overscroll-behavior:contain;padding:14px;background:var(--paper);color:var(--ink);border:1px solid #bdcdb8;border-radius:12px;box-shadow:0 10px 42px #17342530}
#nodePeek .peekHead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}#nodePeek h3{margin:2px 0}#nodePeek button{padding:3px 8px}#nodePeek:not(:popover-open){display:none}
@media(prefers-reduced-motion:no-preference){
 #nodePeek{opacity:0;transform:translateY(6px) scale(.985);transition:opacity 160ms ease,transform 180ms ease,display 180ms allow-discrete,overlay 180ms allow-discrete}
 #nodePeek:popover-open{opacity:1;transform:none}
 @starting-style{#nodePeek:popover-open{opacity:0;transform:translateY(6px) scale(.985)}}
 #runs:not([hidden]) .evalSummary{animation:eval-in 180ms ease-out}
 @keyframes eval-in{from{opacity:.25;transform:translateY(4px)}}
}
.roundPairGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,21rem),1fr));gap:12px;margin-block:8px 18px}
.roundPair{min-width:0;border:1px solid var(--line);border-radius:10px;padding:12px 15px}.roundPair h4{margin:0;font-size:15px}
.roundPair .roundTable{margin-block:8px}.roundPair .roundTable tfoot{background:#edf4e9}.roundPair.test .roundTable tfoot{background:#eaf2f6}
.roundPair .pairRule{font-size:12px;color:var(--muted)}.roundPair .pairLead{font-weight:650;margin:10px 0 2px;font-variant-numeric:tabular-nums}
.treeTools{display:flex;align-items:center;justify-content:flex-end;gap:5px;padding:6px 12px;border-bottom:1px solid var(--line)}
.treeTools button{padding:4px 9px;min-height:32px}.treeTools output{min-width:5ch;text-align:center;font:12px var(--mono)}.treeTools button:disabled{opacity:.45;cursor:default}
.stage{height:min(var(--tree-height,32rem),clamp(13rem,57dvh,43rem));overflow-anchor:none;position:relative}
.treeCanvas{width:max-content;min-width:100%;min-height:100%;display:grid;place-items:center}
.stage.zoomed{cursor:grab}.stage.dragging{cursor:grabbing}.stage.dragging *{cursor:inherit}
</style></head>
<body>
<header><div><strong><img class="logomark" src="data:image/png;base64,REPORT_LOGO_BASE64" width="32" height="32" alt="">Prompt Tree</strong><nav aria-label="{{报告导航}}"><a href="#growth">{{生长轨迹}}</a><a href="#comparison">{{版本对比}}</a></nav></div></header>
<main>
<div class="heading"><div><small id="kind"></small><h1 id="title"></h1><p class="muted" id="objective"></p></div><section class="stats" aria-label="{{验证集概览}}" id="stats"></section></div>
<div class="grid">
<section class="panel" id="growth"><div class="panelhead"><div><h2>{{Prompt 生长轨迹}}</h2><small id="stageCaption"></small></div><button id="winnerPath" aria-pressed="false">{{只看选中路径}}</button></div>
<div id="lockSummary" class="lockSummary" hidden></div>
<div id="testSummary" class="lockSummary testSummary" hidden></div>
<nav id="layerNav" class="layerNav" aria-label="{{每层单次初筛最高分，选择以定位节点}}"></nav>
<div class="treeTools" role="group" aria-label="{{树视图缩放}}"><button id="zoomOut" aria-label="{{缩小树视图}}" aria-controls="tree">−</button><output id="zoomLevel" aria-label="{{当前缩放比例}}"></output><button id="zoomIn" aria-label="{{放大树视图}}" aria-controls="tree">＋</button><button id="zoomFit" aria-controls="tree" aria-pressed="true">{{适应视窗}}</button></div>
<div class="stage" id="treeStage" tabindex="0" aria-label="{{可缩放的树视图}}" role="region"><div class="treeCanvas"><svg id="tree" role="group" aria-label="{{从顶部根节点向下生长的 Prompt 探索树}}"></svg></div></div>
<div class="transport"><button id="play">{{播放生长}}</button><button id="restart">{{从头播放}}</button><input id="timeline" aria-label="{{生长进度}}" type="range" min="0" step="1"><output id="position" for="timeline"></output><select id="speed" aria-label="{{播放速度}}"><option value="0.65">{{慢速}}</option><option value="1" selected>1×</option><option value="2">2×</option></select></div></section>
<section class="panel detail"><small id="nodeMeta"></small><h2 id="nodeTitle"></h2><nav aria-label="{{节点详情}}"><button data-tab="rationale">{{依据}}</button><button data-tab="runs">{{评测}}</button><button data-tab="prompt">Prompt</button></nav><div id="rationale"></div><div id="runs" hidden></div><pre id="prompt" hidden></pre><a id="jumpDiff" href="#comparison">{{查看 Prompt 改动 ↓}}</a></section>
</div>
<section class="panel compare" id="comparison" aria-labelledby="comparisonTitle">
<div class="panelhead"><div><h2 id="comparisonTitle">{{Prompt 对比}}</h2><p id="comparedPair" class="caption"></p></div>
<div class="versionPickers"><label>{{左版 · 对照}}<select id="compareBase"><option value="">{{跟随右版的父节点}}</option></select></label><label>{{右版 · 查看改动}}<select id="compareNode"></select></label></div></div>
<div class="compareBody" id="compareBody"></div></section>
<details class="panel more" id="records"><summary>{{实验记录与来源}}</summary><p class="notice" id="notice"></p><div id="tierDecision"></div><p id="layerStates"></p><h3>{{评测提交概况}}</h3><p id="counts"></p><p id="versionCounts" class="muted"></p><h3>{{跳过、拒绝与复用记录}}</h3><div id="attempts"></div><h3>{{复现信息}}</h3><ul id="limitations"></ul><pre id="metadata"></pre></details>
<section popover="auto" id="nodePeek" role="dialog" aria-labelledby="peekTitle">
<div class="peekHead"><div><small id="peekId"></small><h3 id="peekTitle"></h3></div><button id="closePeek" aria-label="{{收起节点评测}}">{{收起}}</button></div>
<div id="peekScores"></div></section>
</main>
<script type="application/json" id="report-data">REPORT_DATA</script>
<script id="report-ui">
'use strict';
/* REPORT_DIFF_FUNCTIONS */
const data=JSON.parse(document.getElementById('report-data').textContent),manifest=data.manifest,nodes=data.nodes;

  fold.addEventListener('toggle',()=>{if(fold.open && fold.children.length===1)for(const l of lines.slice(start,end))fold.append(codePair(l,l));});
  view.append(fold);

 let at=0;
 for(const {lo,hi} of blocks){
  foldLines(at,lo);
  const chunk=lines.slice(lo,hi+1);
  const range=(a,b)=>a===b?String(a):a+'–'+b;
  for(let i=0;i<chunk.length;){
   if(chunk[i].kind==='same'){const l=chunk[i++];view.append(codePair(l,l));continue;}
   const start=i;
   while(i<chunk.length && chunk[i].kind!=='same')i++;
   const edits=chunk.slice(start,i),fresh=edits.filter(l=>l.kind==='add'),gone=edits.filter(l=>l.kind==='remove');
   const labels=[];

   }
   if(fresh.length)labels.push('{{右版第 }}'+range(fresh[0].current,fresh.at(-1).current)+'{{ 行新增}}');
   view.append(el('div',labels.join(' · '),'range'));
   for(let j=0;j<Math.max(gone.length,fresh.length);j++)view.append(codePair(gone[j],fresh[j]));
  }

function setupZoom(){
 const tree=$('tree'),stage=$('treeStage'),fit=$('zoomFit'),plus=$('zoomIn'),minus=$('zoomOut');
 const {width,height}=tree.viewBox.baseVal;
 let scale=1,autoFit=true,drag=null;
 const fitScale=()=>Math.min(1,stage.clientWidth/width,stage.clientHeight/height);
 function resize(next,x,y){
  const area=stage.getBoundingClientRect(),before=tree.getBoundingClientRect();
  x??=area.left+stage.clientWidth/2;y??=area.top+stage.clientHeight/2;
  const u=(x-before.left)/before.width,v=(y-before.top)/before.height;
  const min=Math.min(.1,fitScale());
  scale=Math.min(3,Math.max(min,next));
  tree.style.width=width*scale+'px';tree.style.height=height*scale+'px';
  if(autoFit){stage.scrollTo(0,0);}
  else{
   const after=tree.getBoundingClientRect();
   stage.scrollLeft+=after.left+u*after.width-x;stage.scrollTop+=after.top+v*after.height-y;
  }
  $('zoomLevel').textContent=Number((scale*100).toFixed(scale<.1?1:0))+'%';
  fit.setAttribute('aria-pressed',String(autoFit));minus.disabled=scale<=min;plus.disabled=scale>=3;
  stage.classList.toggle('zoomed',stage.scrollWidth>stage.clientWidth||stage.scrollHeight>stage.clientHeight);
  positionPeek();
 }
 function zoom(factor,x,y){autoFit=false;resize(scale*factor,x,y);}
 function fitTree(){autoFit=true;resize(fitScale());}
 plus.onclick=()=>zoom(1.35);minus.onclick=()=>zoom(1/1.35);fit.onclick=fitTree;
 stage.addEventListener('wheel',e=>{
  if(!(e.ctrlKey||e.metaKey)||!e.deltaY)return;
  e.preventDefault();zoom(Math.exp(-Math.max(-100,Math.min(100,e.deltaY))*.009),e.clientX,e.clientY);
 },{passive:false});
 stage.addEventListener('pointerdown',e=>{
  if(e.pointerType!=='mouse'||e.button!==0||e.target.closest('.node')||!stage.classList.contains('zoomed'))return;
  drag={id:e.pointerId,x:e.clientX,y:e.clientY,left:stage.scrollLeft,top:stage.scrollTop};
  stage.setPointerCapture(e.pointerId);stage.classList.add('dragging');e.preventDefault();
 });
 stage.addEventListener('pointermove',e=>{
  if(drag?.id===e.pointerId)stage.scrollTo(drag.left+drag.x-e.clientX,drag.top+drag.y-e.clientY);
 });
 stage.addEventListener('lostpointercapture',()=>{drag=null;stage.classList.remove('dragging');});

 fitTree();
}
function animateEntry(element,frames,duration,delay){

}
function render(intro=false,animate=true){

  const id=n.event_id,item=cards.get(id),edge=edges.get(id),shown=visible.has(id);
  const newly=shown&&!item.visible&&animate,delay=intro?((n.round||lineage(id).size)-1)*320:0;
  if(edge){
   for(const path of [edge.edge,edge.particle]){
    path.style.display=shown?'':'none';path.classList.toggle('active',active.has(id));
   }
   if(newly)animateEntry(edge.edge,[{strokeDasharray:'1',strokeDashoffset:1},{strokeDasharray:'1',strokeDashoffset:0}],650/speed,delay);
  }
  item.g.style.display=shown?'':'none';

  item.g.setAttribute('aria-pressed',String(selected===id));item.g.classList.toggle('selected',selected===id);

function stop(){clearTimeout(timer);timer=null;$('tree').classList.remove('playing');$('play').textContent=reveal<sequence.length-1?'{{继续播放}}':'{{播放生长}}';}

function selectVersion(id){

const layersByDepth=new Map();
for(const n of nodes){

buildTree();setupZoom();setTab(byVersion.has(winner.version_id)||testByVersion.has(winner.version_id)?'runs':'rationale');show(selected);render(true);
